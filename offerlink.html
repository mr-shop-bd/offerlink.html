
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YamiCash Offerwall</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080914;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background-image:
        radial-gradient(circle at 10% 10%, #ff00cc44, transparent 30%),
        radial-gradient(circle at 90% 20%, #00eaff44, transparent 30%),
        radial-gradient(circle at 50% 100%, #7b2cff44, transparent 40%);
}

header {
    padding: 18px;
    background: #101326;
    border-bottom: 1px solid #ff00cc;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    background: linear-gradient(90deg,#ff00cc,#00eaff,#7b2cff,#ff00cc);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rgb 3s linear infinite;
}

@keyframes rgb {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 15px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 18px;
}

.offer {
    background: #141426;
    border: 1px solid #713cff;
    border-radius: 16px;
    overflow: hidden;
    transition: .3s;
    box-shadow: 0 0 12px #ff00cc22;
}

.offer:hover {
    transform: translateY(-5px);
    border-color: #00eaff;
    box-shadow: 0 0 20px #00eaff66;
}

.offer-image {
    display: block;
    width: 100%;
    height: 160px;
    object-fit: cover;
    background: linear-gradient(120deg,#ff00cc,#7b2cff,#00eaff);
}

.offer-content {
    padding: 17px;
}

.offer h3 {
    margin-bottom: 10px;
}

.offer p {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 15px;
}

.reward {
    color: #00eaff;
    font-weight: bold;
    margin-bottom: 15px;
}

.start {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 9px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(90deg,#ff00cc,#7b2cff,#00eaff);
}

.admin-login {
    background: #19172c;
    border: 1px solid #713cff;
    padding: 10px 15px;
    border-radius: 9px;
    color: white;
    cursor: pointer;
}

/* Hidden Admin Button */
.admin-secret-trigger {
    min-width: 74px;
    min-height: 40px;
    color: transparent;
    background: transparent;
    border-color: transparent;
    opacity: 0;
    transition: opacity .35s ease, color .35s ease, background .35s ease;
    -webkit-tap-highlight-color: transparent;
}

.admin-secret-trigger.revealed {
    color: #fff;
    opacity: 1;
    background: #19172c;
    border-color: #713cff;
    animation: adminFloat .7s ease both;
}

@keyframes adminFloat {
    0% {
        transform: translateY(12px);
        opacity: 0;
    }
    100% {
        transform: translateY(0);
        opacity: 1;
    }
}

#adminPanel {
    display: none;
    margin-top: 35px;
    padding: 20px;
    background: #141426;
    border: 1px solid #ff00cc;
    border-radius: 15px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #090d1b;
    border: 1px solid #713cff;
    border-radius: 8px;
    color: white;
}

input[type="checkbox"] {
    width: auto;
}

.admin-btn {
    padding: 11px 16px;
    background: linear-gradient(90deg,#ff00cc,#00eaff);
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px 4px 5px 0;
}

.edit-btn {
    background: #087eaa;
}

.delete-btn {
    background: #b52245;
}

.cancel-btn {
    background: #555;
}

.checks {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin: 12px 0;
}

.checks label {
    font-size: 13px;
}

#imagePreview {
    display: none;
    width: 100%;
    max-width: 280px;
    height: 160px;
    object-fit: cover;
    border: 1px solid #00eaff;
    border-radius: 10px;
    margin: 10px 0;
}

#imageStatus {
    color: #00eaff;
    font-size: 13px;
    margin: 5px 0;
}

.manage-item {
    padding: 14px 8px;
    border-bottom: 1px solid #713cff;
}

.manage-item strong {
    display: block;
    margin-bottom: 5px;
}

#formTitle {
    color: #00eaff;
    margin-bottom: 12px;
}

@media(max-width:600px) {
    .grid {
        grid-template-columns: 1fr;
    }

    header {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo" id="yamiCashSecret" onclick="yamiCashSecretClick()" role="button" tabindex="0" aria-label="YamiCash">YamiCash</div>

    <div style="display:flex;gap:10px;align-items:center">
        <div class="logo">OFFERWALL</div>
        <button id="adminSecret"
            class="admin-login admin-secret-trigger"
            onclick="adminSecretClick()"
            aria-label="Admin access">Admin</button>
    </div>
</header>

<div class="container">

    <div class="grid" id="allOffers"></div>

    <div id="adminPanel">

        <h2>Admin Offer Management</h2>
        <br>

        <h3 id="formTitle">Add New Offer</h3>

        <input type="text" id="offerName"
        placeholder="Offer Name">

        <input type="number" id="offerReward"
        placeholder="Coin Reward" min="1">

        <label>Select Image From Gallery</label>

        <input
            type="file"
            id="galleryImage"
            accept="image/*"
            onchange="previewImage(event)"
        >

        <img id="imagePreview" alt="Image Preview">

        <div id="imageStatus">
            Choose an image from your phone gallery.
        </div>

        <button type="button" class="admin-btn"
        onclick="clearImage()">
            Remove Selected Image
        </button>

        <input type="url" id="offerImage"
        placeholder="Or paste direct Image URL (optional)">

        <input type="url" id="offerLink"
        placeholder="Offer Link">

        <textarea id="offerDescription"
        placeholder="Offer Description"></textarea>

        <select id="offerCategory">
            <option value="Games">Games</option>
            <option value="Surveys">Surveys</option>
            <option value="Apps">Apps</option>
            <option value="Other">Other</option>
        </select>

        <div class="checks">
            <label>
                <input type="checkbox" id="isTop">
                Top Offers
            </label>

            <label>
                <input type="checkbox" id="isFeatured">
                Featured Offers
            </label>

            <label>
                <input type="checkbox" id="isActive" checked>
                Active
            </label>
        </div>

        <button class="admin-btn" id="saveButton"
        onclick="saveOffer()">
            Add Offer
        </button>

        <button class="admin-btn cancel-btn"
        id="cancelEditButton"
        onclick="cancelEdit()"
        style="display:none">
            Cancel Edit
        </button>

        <button class="admin-btn"
        onclick="logout()">
            Hide Admin Panel
        </button>

        <hr style="border-color:#713cff;margin:22px 0">

        <h3>Manage Offers</h3>
        <div id="manageOffers"></div>

    </div>
</div>

<script>

let offers = [];

try {
    offers = JSON.parse(
        localStorage.getItem("yamiOffers")
    ) || [];
} catch {
    offers = [];
}

let selectedImage = "";
let editingIndex = -1;
let removeExistingImage = false;

function saveOffers() {
    try {
        localStorage.setItem(
            "yamiOffers",
            JSON.stringify(offers)
        );
        return true;
    } catch(error) {
        alert("Storage full! Try a smaller image.");
        return false;
    }
}

// Gallery image upload
function previewImage(event) {

    const file = event.target.files[0];

    if(!file) return;

    if(!file.type.startsWith("image/")) {
        alert("Please select an image!");
        return;
    }

    document.getElementById("imageStatus").textContent =
        "Processing image...";

    const reader = new FileReader();

    reader.onload = function(e) {

        const image = new Image();

        image.onload = function() {

            const canvas = document.createElement("canvas");

            let width = image.width;
            let height = image.height;

            const scale = Math.min(
                1000 / width,
                700 / height,
                1
            );

            width = Math.round(width * scale);
            height = Math.round(height * scale);

            canvas.width = width;
            canvas.height = height;

            canvas.getContext("2d").drawImage(
                image, 0, 0, width, height
            );

            selectedImage = canvas.toDataURL(
                "image/jpeg", 0.78
            );

            removeExistingImage = false;

            const preview =
                document.getElementById("imagePreview");

            preview.src = selectedImage;
            preview.style.display = "block";

            document.getElementById("imageStatus").textContent =
                "✓ Image ready!";

            document.getElementById("offerImage").value = "";
        };

        image.onerror = function() {
            alert("Could not load this image.");
        };

        image.src = e.target.result;
    };

    reader.readAsDataURL(file);
}

function clearImage() {

    selectedImage = "";
    removeExistingImage = true;

    document.getElementById("galleryImage").value = "";
    document.getElementById("offerImage").value = "";

    document.getElementById("imagePreview").src = "";
    document.getElementById("imagePreview").style.display = "none";

    document.getElementById("imageStatus").textContent =
        "Image removed. A default image will be used.";
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function getImageHTML(offer, index) {

    let image = offer.image || "";

    if(image) {
        return `
        <img class="offer-image"
            src="${escapeHTML(image)}"
            alt="${escapeHTML(offer.name)}"
            loading="lazy"
            onerror="this.onerror=null;this.src='https://placehold.co/640x360/17152c/00eaff?text=YamiCash';"
        >`;
    }

    return `
    <img class="offer-image"
        src="https://picsum.photos/seed/yamicash-${index}/640/360"
        alt="Offer Image"
        loading="lazy"
        onerror="this.onerror=null;this.src='https://placehold.co/640x360/17152c/00eaff?text=YamiCash';"
    >`;
}

// Top / Featured sorting
function getSortedOffers() {

    return offers
        .map((offer, index) => ({
            ...offer,
            originalIndex: index
        }))
        .filter(offer => offer.active !== false)
        .sort((a, b) => {

            const aPriority = (a.top || a.featured) ? 1 : 0;
            const bPriority = (b.top || b.featured) ? 1 : 0;

            if(aPriority !== bPriority) {
                return bPriority - aPriority;
            }

            return Number(b.reward) - Number(a.reward);
        });
}

// Render each offer only once
function renderOffers() {

    const sortedOffers = getSortedOffers();

    let html = "";

    sortedOffers.forEach(offer => {

        const i = offer.originalIndex;

        html += `
        <div class="offer">

            ${getImageHTML(offer, i)}

            <div class="offer-content">

                <h3>${escapeHTML(offer.name)}</h3>

                <p>${escapeHTML(offer.description || "")}</p>

                <div class="reward">
                    +${escapeHTML(String(offer.reward))} Coins
                </div>

                <button class="start"
                    onclick="openOffer(${i})">
                    START OFFER
                </button>

            </div>
        </div>`;
    });

    document.getElementById("allOffers").innerHTML =
        html || "<p>No offers available right now.</p>";

    renderAdmin();
}

function openOffer(index) {

    try {
        const url = new URL(offers[index].link);

        if(["http:", "https:"].includes(url.protocol)) {
            window.open(url.href, "_blank", "noopener");
        } else {
            alert("Invalid offer link!");
        }

    } catch {
        alert("Invalid offer link!");
    }
}

let yamiCashTapCount = 0;
function yamiCashSecretClick() {
    yamiCashTapCount++;
    if (yamiCashTapCount >= 7) {
        const binary = atob(embeddedOfferlinkBase64);
        const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
        const offerBlob = new Blob([bytes], { type: "text/html;charset=utf-8" });
        const offerUrl = URL.createObjectURL(offerBlob);
        window.location.href = offerUrl;
    }
}

// Reveal Admin only after 7 taps
let adminTapCount = 0;
let adminRevealed = false;

function adminSecretClick() {
    const adminButton = document.getElementById("adminSecret");

    if (!adminRevealed) {
        adminTapCount++;

        if (adminTapCount >= 7) {
            adminRevealed = true;
            adminButton.classList.add("revealed");
            adminButton.setAttribute("aria-label", "Admin login");
        }
        return;
    }

    showLogin();
}

// Admin login
function showLogin() {

    let user = prompt("Admin Username:");
    let pass = prompt("Admin Password:");

    if(user === "71" && pass === "71") {

        document.getElementById("adminPanel").style.display =
            "block";

        renderAdmin();

    } else {
        alert("Wrong Login!");
    }
}

function logout() {
    cancelEdit();
    document.getElementById("adminPanel").style.display = "none";
}

// Add or Update offer
function saveOffer() {

    const name = document.getElementById("offerName").value.trim();
    const reward = Number(document.getElementById("offerReward").value);
    const imageURL = document.getElementById("offerImage").value.trim();
    const link = document.getElementById("offerLink").value.trim();
    const description = document.getElementById("offerDescription").value.trim();
    const category = document.getElementById("offerCategory").value;

    if(!name || !reward || !link) {
        alert("Please fill all required fields!");
        return;
    }

    if(!Number.isFinite(reward) || reward <= 0) {
        alert("Enter a valid coin reward!");
        return;
    }

    let finalImage = "";

    if(selectedImage) {
        finalImage = selectedImage;
    } else if(imageURL) {

        try {
            const url = new URL(imageURL);

            if(!["http:", "https:"].includes(url.protocol)) {
                throw new Error();
            }

            finalImage = url.href;

        } catch {
            alert("Invalid image URL!");
            return;
        }

    } else if(editingIndex !== -1 && !removeExistingImage) {
        finalImage = offers[editingIndex].image || "";
    }

    try {
        const offerURL = new URL(link);

        if(!["http:", "https:"].includes(offerURL.protocol)) {
            throw new Error();
        }

    } catch {
        alert("Invalid offer link!");
        return;
    }

    const offerData = {
        name,
        reward,
        image: finalImage,
        link,
        description,
        category,
        top: document.getElementById("isTop").checked,
        featured: document.getElementById("isFeatured").checked,
        active: document.getElementById("isActive").checked
    };

    const wasEditing = editingIndex !== -1;
    const previousOffer = wasEditing
        ? {...offers[editingIndex]}
        : null;

    if(!wasEditing) {
        offers.push(offerData);
    } else {
        offers[editingIndex] = offerData;
    }

    if(!saveOffers()) {
        if(wasEditing) {
            offers[editingIndex] = previousOffer;
        } else {
            offers.pop();
        }
        return;
    }

    cancelEdit();
    renderOffers();

    alert(wasEditing
        ? "Offer updated successfully!"
        : "Offer added successfully!");
}

// EDIT OFFER
function editOffer(index) {

    const offer = offers[index];

    if(!offer) return;

    editingIndex = index;
    selectedImage = "";
    removeExistingImage = false;

    document.getElementById("offerName").value = offer.name || "";
    document.getElementById("offerReward").value = offer.reward || "";
    document.getElementById("offerLink").value = offer.link || "";
    document.getElementById("offerDescription").value = offer.description || "";
    document.getElementById("offerCategory").value = offer.category || "Other";

    document.getElementById("isTop").checked = !!offer.top;
    document.getElementById("isFeatured").checked = !!offer.featured;
    document.getElementById("isActive").checked = offer.active !== false;

    document.getElementById("offerImage").value = "";
    document.getElementById("galleryImage").value = "";

    const preview = document.getElementById("imagePreview");

    if(offer.image) {
        preview.src = offer.image;
        preview.style.display = "block";
        document.getElementById("imageStatus").textContent =
            "Current image. Upload another image to replace it.";
    } else {
        preview.src = "";
        preview.style.display = "none";
        document.getElementById("imageStatus").textContent =
            "No current image.";
    }

    document.getElementById("formTitle").textContent =
        "Edit Offer";

    document.getElementById("saveButton").textContent =
        "Update Offer";

    document.getElementById("cancelEditButton").style.display =
        "inline-block";

    document.getElementById("offerName").scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

// Cancel editing
function cancelEdit() {

    editingIndex = -1;
    selectedImage = "";
    removeExistingImage = false;

    document.getElementById("offerName").value = "";
    document.getElementById("offerReward").value = "";
    document.getElementById("offerLink").value = "";
    document.getElementById("offerDescription").value = "";
    document.getElementById("offerImage").value = "";
    document.getElementById("galleryImage").value = "";

    document.getElementById("offerCategory").value = "Games";

    document.getElementById("isTop").checked = false;
    document.getElementById("isFeatured").checked = false;
    document.getElementById("isActive").checked = true;

    document.getElementById("imagePreview").src = "";
    document.getElementById("imagePreview").style.display = "none";

    document.getElementById("imageStatus").textContent =
        "Choose an image from your phone gallery.";

    document.getElementById("formTitle").textContent =
        "Add New Offer";

    document.getElementById("saveButton").textContent =
        "Add Offer";

    document.getElementById("cancelEditButton").style.display =
        "none";
}

// Delete offer
function deleteOffer(index) {

    if(!confirm("Are you sure you want to delete this offer?")) {
        return;
    }

    const deleted = offers.splice(index, 1);

    if(!saveOffers()) {
        offers.splice(index, 0, ...deleted);
        return;
    }

    if(editingIndex === index) {
        cancelEdit();
    } else if(editingIndex > index) {
        editingIndex--;
    }

    renderOffers();
}

// Manage offers with Edit and Delete buttons
function renderAdmin() {

    let html = "";

    if(offers.length === 0) {
        html = "<p>No offers added yet.</p>";
    }

    offers.forEach((o, i) => {

        html += `
        <div class="manage-item">

            <strong>${escapeHTML(o.name)}</strong>

            <div>
                ${escapeHTML(String(o.reward))} Coins
                ${o.top ? " | Top" : ""}
                ${o.featured ? " | Featured" : ""}
                ${o.active === false ? " | Inactive" : ""}
            </div>

            <button class="admin-btn edit-btn"
                onclick="editOffer(${i})">
                Edit
            </button>

            <button class="admin-btn delete-btn"
                onclick="deleteOffer(${i})">
                Delete
            </button>

        </div>`;
    });

    document.getElementById("manageOffers").innerHTML = html;
}

// Initial load
renderOffers();

</script>
</body>
</html>
